[package]
name = "storyboard"
version = "0.1.0"
description = "A local motion studio for macOS, Claude, and Codex"
edition = "2024"
license = "MIT"

[lib]
name = "storyboard"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
resvg = "0.46"
rfd = "0.15"
tempfile = "3"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true
